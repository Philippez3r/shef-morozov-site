# Временная диагностика: может ли инфраструктура GitHub разрешить домен в зоне .ru.
# Пишет результат в dns-check.txt. Удалить после разбирательства.
name: dns-check
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve
        run: |
          {
            echo "date: $(date -u)"
            echo "runner resolver:"; cat /etc/resolv.conf | grep -v '^#'
            for h in fridgik.ru www.fridgik.ru yandex.ru philippez3r.github.io github.com; do
              echo "== $h"
              echo "-- system resolver:"; getent hosts "$h" || echo "FAIL system"
              echo "-- dig default:"; dig +short "$h" A || echo "FAIL dig"
              echo "-- dig NS:"; dig +short "$h" NS
            done
            echo "== .ru TLD servers reachable?"; dig +short ru NS | head -3
            echo "== direct query to a.dns.ripn.net:"; dig +time=5 +tries=1 @a.dns.ripn.net fridgik.ru NS +short || echo "FAIL ripn"
            echo "== direct query to cloudflare ns:"; dig +time=5 +tries=1 @margot.ns.cloudflare.com fridgik.ru A +short || echo "FAIL cf"
            echo "== https:"; curl -sS -o /dev/null -m 20 -w "%{http_code}\n" https://fridgik.ru/ 2>&1 || true
          } > dns-check.txt 2>&1
          cat dns-check.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dns-check.txt
          git commit -m "dns-check result" || exit 0
          git push
